[project]
name = "neurolink-lite"
version = "0.1.0"
description = "Thought-controlled cursor: EEG motor imagery classification (CSP+LDA, EEGNet) with a real-time LSL replay demo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NeuroLink-lite contributors" }]
keywords = ["eeg", "bci", "motor-imagery", "eegnet", "csp", "lsl"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "mne>=1.13",
    "torch>=2.2",
    "pylsl>=1.16",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "typer>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
neurolink = "neurolink.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurolink"]

[tool.uv]
# CPU-only torch keeps the install small and avoids CUDA downloads.
index = [{ name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true }]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "lsl: tests that need a working liblsl (skipped if unavailable)",
    "slow: tests that take more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
packages = ["neurolink"]
mypy_path = "src"
strict = true
warn_unreachable = true
ignore_missing_imports = true
